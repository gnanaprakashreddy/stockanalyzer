name: Daily data snapshot

on:
  schedule:
    - cron: "30 0 * * 1-6"   # 06:00 IST, Mon-Sat (after the US close, before the Indian open)
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch fundamentals
        run: python snapshot.py --out snapshot_out/fundamentals.json.gz
        env:
          SNAPSHOT_EXTRA: ${{ secrets.SNAPSHOT_EXTRA }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      # Force-pushed single-commit branch: the repo doesn't grow every day, and pushes to `snapshot`
      # don't redeploy the Streamlit app (it watches `main`). The app downloads the file directly.
      - name: Publish to the snapshot branch
        working-directory: snapshot_out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data snapshot $(date -u +%F)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshot
